<div class="catalogeu-navigation-plugin-floatbar">
  <div class="buttons">
    <button min_buttons class="catalog button" attr-i18n="title-up-right=catalogTitle">
      <svg id="tree"></svg>
    </button>
    <svg class="new_version" id="new"></svg>
  </div>
  <div class="panel">
    <div class="title">
      <span class="drag" attr-i18n="title-right=moveTitle">
        <svg id="drag"></svg>
      </span>
      <div class="shortcut">
        <svg id="shortcut"></svg>
        <div class="shortcut-keys">
          <div class="keys">
            <div class="item category">
              <label></label>
              <!-- <svg id="button"></svg> -->
              <label data-i18n="customizedShortcutKeys">自定义快捷键</label>
              <label data-i18n="explain">说明</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="panel" checked id="asdfawe">
                <label for="asdfawe"></label>
              </div>
              <svg id="tree"></svg>
              <input type="text" maxlength="1" action-name="panel" value="t" title="自定义按钮，只支持字母和数字">
              <label data-i18n="togglePanel">Toggle panel</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="fold" checked id="der3">
                <label for="der3"></label>
              </div>
              <svg id="unfold"></svg>
              <input type="text" maxlength="1" action-name="fold" value="1">
              <label data-i18n="toggleTree">Toggle tree</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="plies" checked id="dw23">
                <label for="dw23"></label>
              </div>
              <svg id="fold"></svg>
              <input type="text" maxlength="1" action-name="plies" value="2">
              <label data-i18n="toggleSubtree">Toggle subtree</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="refresh" checked id="wer13r3">
                <label for="wer13r3"></label>
              </div>
              <svg id="layer"></svg>
              <input type="text" maxlength="1" action-name="refresh" value="3">
              <label data-i18n="toggleDepth">Toggle tree depth</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="jmode" checked id="w90t3">
                <label for="w90t3"></label>
              </div>
              <svg id="click"></svg>
              <input type="text" maxlength="1" action-name="jmode" value="5">
              <label data-i18n="toggleNavigationAction">Navigation action</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="read" checked id="wert3">
                <label for="wert3"></label>
              </div>
              <svg id="read"></svg>
              <input type="text" maxlength="1" action-name="read" value="r">
              <label data-i18n="readMode">Read mode</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="read" checked>
                <label></label>
              </div>
              <svg id="find"></svg>
              <label>Ctrl+F</label>
              <label data-i18n="search">Search</label>
            </div>
          </div>
          <div class="keys">
            <div class="item category">
              <label></label>
              <!-- <svg id="roll"></svg> -->
              <label data-i18n="customizedShortcutKeys">自定义快捷键</label>
              <label data-i18n="explain">说明</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="wheel" name="wheel" id="d34geq">
                <label for="d34geq"></label>
              </div>
              <svg id="prompt"></svg>
              <label style="white-space: nowrap;">Alt+Wheel<svg id="wheel"
                  style="display: inline !important;width: 1.2em;vertical-align: text-top;margin-left: .1em;"></svg></label>
              <label data-i18n="scrollPrompt">Scroll prompt</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="headlineUp,headlineDown" checked id="w1er13r3">
                <label for="w1er13r3"></label>
              </div>
              <svg id="heading"></svg>
              <div>
                <input type="text" maxlength="1" action-name="headlineUp" value="Q">
                /
                <input type="text" maxlength="1" action-name="headlineDown" value="W">
              </div>
              <label data-i18n="scrollHeading">Scroll heading</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="promptUp,promptDown" checked id="w1e3r3">
                <label for="w1e3r3"></label>
              </div>
              <svg id="prompt"></svg>
              <div>
                <input type="text" maxlength="1" action-name="promptUp" value="A">
                /
                <input type="text" maxlength="1" action-name="promptDown" value="S">
              </div>
              <label data-i18n="scrollPrompt">Scroll prompt</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="firstPrompt" checked id="d3eq">
                <label for="d3eq"></label>
              </div>
              <svg id="prompt"></svg>
              <input type="text" maxlength="1" action-name="firstPrompt" value="F">
              <label data-i18n="scrollToFirstPrompt">Scroll to the first prompt</label>
            </div>
            <div class="item">
              <div class="sync-switch">
                <input type="checkbox" action-name="lastPrompt" checked id="dd3eq">
                <label for="dd3eq"></label>
              </div>
              <svg id="prompt"></svg>
              <input type="text" maxlength="1" action-name="lastPrompt" value="E">
              <label data-i18n="scrollToLastPrompt">Scroll to the last prompt</label>
            </div>
            <div class="item">
              <label></label>
              <svg id="screen"></svg>
              <label style="line-height: 1.8em;">PgUp/PgDn<br>Home/End</label>
              <label data-i18n="scrollScreen">Scroll the screen</label>
            </div>
          </div>
          <div class="tip">
            <h3 data-i18n="shortcutTipTitle">Tip:</h3>
            <ul style="list-style:circle;">
              <li html-i18n="shortcutTip1">快捷键 只能填单个 <b>字母或数字</b>，<b>可以修改</b>，可以禁用/启用。</li>
              <li html-i18n="shortcutTip2">如果光标在输入框中，快捷键单个按键<b>不起作用</b>（禁止妨碍用户输入）。</li>
              <li html-i18n="shortcutTip3">如果光标在输入框中，<b>Alt+数字或字母</b>，快捷键依然有效。</li>
            </ul>
          </div>
        </div>
      </div>
      <span class="down">
        <svg id="down"></svg>
      </span>
      <span class="read inactive" attr-i18n="title-down=readMode">
        <svg id="read"></svg>
      </span>
      <!-- <span class="find">
        <svg id="find"></svg>
      </span> -->
      <span class="name" attr-i18n="title-down=moveTitle" data-i18n="title"></span>
      <a class="get-full" href="https://chromewebstore.google.com/detail/long-chatgpt-conversation/fklppbegohaleadmomfgjgpcighjheba" target="_blank" rel="noopener noreferrer" data-i18n="getFullVersion" attr-i18n="title=getFullVersionTitle"></a>
      <button class="close" attr-i18n="title=closeTitle">✕</button>
    </div>
    <div class="header">
      <button class="fold open" attr-i18n="title-up-right=foldTitle">
        <svg id="unfold"></svg>
        <svg id="fold"></svg>
      </button>
      <button class="plies fold open" attr-i18n="title-up-right=depthTitle">
        <svg id="unfold"></svg>
        <svg id="fold"></svg>
        <span>2</span>
      </button>
      <button class="refresh" attr-i18n="title-up-right=refreshTitle" style="display: none !important;">
        <svg id="layer"></svg>
      </button>
      <button class="layer" attr-i18n="title-up-right=toggleDepth" style="display: none !important;">
        <svg id="layer"></svg>
        <span>3</span>
      </button>
      <!-- <button class="sync" attr-i18n="title-up-right=syncTitle">
        <svg id="sync"></svg>
      </button> -->
      <button class="star inactive" attr-i18n="title-up-right=starTitle">
        <svg id="star"></svg>
      </button>
      <button class="jmode" attr-i18n="title-up-right=toggleNavigationAction">
        <svg id="click"></svg>
        <svg id="hover"></svg>
      </button>
      <button class="gps inactive" attr-i18n="title-up-right=gpsTitle" style="display: none !important;">
        <svg id="gps"></svg>
      </button>
      <button class="full inactive" attr-i18n="title-up-right=partialTitle">
        <svg id="full"></svg>
      </button>
      <div class="more">
        <svg id="more"></svg>
        <span class="more-list">
          <button class="deep" attr-i18n="title-up-right=deepTitle">
            <svg id="deep"></svg>
          </button>
          <!-- <button class="full" attr-i18n="title-up-right=partialTitle">
            <svg id="full"></svg>
          </button> -->
        </span>
      </div>
    </div>
    <ul class="tree" attrs-i18n="empty-notice=emptyNotice"></ul>
    <div class="on-empty-tree">
      <span data-i18n="emptyNotice">没有对话消息？</span>
    </div>
    <div class="scroll-prompt" style="display: none !important;">
      <span data-i18n="scrollOptimization">滚动技巧</span>
      <div html-i18n="scrollOptimizationContent">
        1.当大纲区域无需滚动时，滚轮操作自动作用于聊天区域。<br>
        1.Alt+滚轮：大纲区域禁止滚动，滚动作用于域聊天区域。<br>
        <b>滚动滚轮试试看</b>，无需移动鼠标到聊天区域。
      </div>
    </div>
    <div class="fullscreen-shade"></div>
    <span class="resizebar resizebar-left" attr-i18n="title-center=resizeWidthTitle"></span>
    <span class="resizebar resizebar-right" attr-i18n="title-center-right=resizeWidthTitle"></span>
    <span class="resizebar2 resizebar-top" attr-i18n="title-top=resizeMaxHeightTitle"></span>
    <span class="resizebar2 resizebar-bottom" attr-i18n="title-bottom=resizeMaxHeightTitle"></span>
  </div>
  <div class="virtualpanel"></div>
  <!-- <div class="titlebox"></div> -->
  <!-- <div class="slider"></div> -->
</div>
